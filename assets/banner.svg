<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Dynamic Pulse Animations -->
    <style>
      .glow-orb-1 {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }
      .animated-wave {
        animation: waveMove 12s linear infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      .pulse-beacon {
        animation: pulseBeacon 3s ease-in-out infinite;
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(50px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-40px, -25px) scale(1.1); }
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes waveMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-600px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle class="glow-orb-1" cx="220" cy="140" r="280" fill="url(#orbGlow1)" />
  <circle class="glow-orb-2" cx="980" cy="280" r="320" fill="url(#orbGlow2)" />

  <!-- Subtle Blueprint Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Audio / Wave Lines (Background decorative element) -->
  <g opacity="0.18">
    <path class="animated-wave" d="M -600 350 Q -450 310 -300 350 T 0 350 T 300 350 T 600 350 T 900 350 T 1200 350 T 1500 350 T 1800 350" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
    <path class="animated-wave" d="M -600 365 Q -450 335 -300 365 T 0 365 T 300 365 T 600 365 T 900 365 T 1200 365 T 1500 365 T 1800 365" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Frame Border -->
  <rect x="2" y="2" width="1196" height="416" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" rx="15" />

  <!-- Foreground Content: Header Tag / Category Pill -->
  <g transform="translate(60, 52)">
    <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" class="pulse-beacon" />
    <text x="32" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title & Foregrounds (Always prominent & readable) -->
  <g transform="translate(60, 135)">
    <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
      Desktop Media Player &amp;
    </text>
    <text x="505" y="0" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
      Novel Reader
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 185)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Hardware-Accelerated Video Players, Streaming Hubs, Web Fiction &amp; E-Book Engines
    </text>
  </g>

  <!-- Interactive / Modern Feature Badges -->
  <g transform="translate(60, 240)">
    <!-- Pill 1: GPU Playback -->
    <g transform="translate(0, 0)">
      <rect width="190" height="46" rx="10" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="6" fill="#38bdf8" />
      <text x="40" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ 4K / HDR / Vulkan</text>
    </g>

    <!-- Pill 2: Light Novels & EPUB -->
    <g transform="translate(205, 0)">
      <rect width="215" height="46" rx="10" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="6" fill="#818cf8" />
      <text x="40" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📖 EPUB &amp; Web Novels</text>
    </g>

    <!-- Pill 3: Self-Hosted Cloud -->
    <g transform="translate(435, 0)">
      <rect width="210" height="46" rx="10" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="6" fill="#c084fc" />
      <text x="40" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">☁️ Self-Hosted Servers</text>
    </g>

    <!-- Pill 4: Open Source First -->
    <g transform="translate(660, 0)">
      <rect width="200" height="46" rx="10" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="6" fill="#34d399" />
      <text x="40" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">✨ 100% Open Ecosystem</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 340)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="32" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Platforms: Windows • macOS • Linux • HTPC • WebDAV • iOS/Android Sync
    </text>
    <text x="1080" y="32" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      ★ MPV • VLC • JELLYFIN • CALIBRE • IINA
    </text>
  </g>
</svg>
